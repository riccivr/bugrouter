name: 'bugrouter CI Action'
description: 'Automate upstream patch status checks (revertable fork alerting) and crash log triage in CI pipelines'
author: 'riccivr'

inputs:
  mode:
    description: "Execution mode: 'patch-check' to audit tracked patches or 'triage' for crash log triage"
    required: false
    default: 'patch-check'
  fail-on-revertable:
    description: "In patch-check mode, fail the action if any tracked patch can be reverted"
    required: false
    default: 'true'
  patches-file:
    description: "Optional path to patches.json (sets BUGROUTER_PATCHES_FILE)"
    required: false
    default: ''
  log-file:
    description: "Path to crash log file for triage mode"
    required: false
    default: ''
  query:
    description: "Optional target query override for triage mode"
    required: false
    default: ''

outputs:
  result-json:
    description: "JSON output from bugrouter patch check or bugrouter agent triage"
    value: ${{ steps.run-bugrouter.outputs.result-json }}
  revertable-count:
    description: "Number of tracked dependency patches ready to revert"
    value: ${{ steps.run-bugrouter.outputs.revertable-count }}

runs:
  using: "composite"
  steps:
    - id: run-bugrouter
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON_REVERTABLE: ${{ inputs.fail-on-revertable }}
        INPUT_PATCHES_FILE: ${{ inputs.patches-file }}
        INPUT_LOG_FILE: ${{ inputs.log-file }}
        INPUT_QUERY: ${{ inputs.query }}
      run: |
        set -euo pipefail

        # 1. Locate or compile bugrouter executable
        if command -v bugrouter >/dev/null 2>&1; then
          BUGROUTER_BIN="bugrouter"
          echo "Using pre-installed bugrouter executable: $(command -v bugrouter)"
        else
          echo "Compiling bugrouter from source ($ACTION_PATH)..."
          BUILD_DIR="${RUNNER_TEMP:-/tmp}/bugrouter-bin"
          mkdir -p "$BUILD_DIR"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$BUILD_DIR/bugrouter" "$ACTION_PATH/cmd/bugrouter"
          BUGROUTER_BIN="$BUILD_DIR/bugrouter"
          echo "Compiled bugrouter to $BUGROUTER_BIN"
        fi

        # 2. Configure environment overrides
        if [ -n "$INPUT_PATCHES_FILE" ]; then
          export BUGROUTER_PATCHES_FILE="$INPUT_PATCHES_FILE"
          echo "BUGROUTER_PATCHES_FILE set to $INPUT_PATCHES_FILE"
        fi

        MODE="$INPUT_MODE"
        FAIL_ON_REVERTABLE="$INPUT_FAIL_ON_REVERTABLE"
        REVERTABLE_COUNT=0

        if [ "$MODE" = "patch-check" ]; then
          echo "Executing: $BUGROUTER_BIN patch check --json"
          RESULT_JSON=$("$BUGROUTER_BIN" patch check --json)
          REVERTABLE_COUNT=$(echo "$RESULT_JSON" | grep -c '"can_revert": true' || true)

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            "$BUGROUTER_BIN" patch check --summary-md >> "$GITHUB_STEP_SUMMARY" || true
          fi

        elif [ "$MODE" = "triage" ]; then
          echo "Executing bugrouter agent triage..."
          TRIAGE_ARGS=("agent" "triage")
          if [ -n "$INPUT_LOG_FILE" ]; then
            TRIAGE_ARGS+=("--log-file" "$INPUT_LOG_FILE")
          fi
          if [ -n "$INPUT_QUERY" ]; then
            TRIAGE_ARGS+=("--query" "$INPUT_QUERY")
          fi

          RESULT_JSON=$("$BUGROUTER_BIN" "${TRIAGE_ARGS[@]}")

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            "$BUGROUTER_BIN" "${TRIAGE_ARGS[@]}" --summary-md >> "$GITHUB_STEP_SUMMARY" || true
          fi
        else
          echo "::error::Unknown mode: $MODE. Supported modes are 'patch-check' and 'triage'."
          exit 1
        fi

        # 3. Export GitHub Action step outputs
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          {
            echo "result-json<<EOF"
            echo "$RESULT_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "revertable-count=$REVERTABLE_COUNT" >> "$GITHUB_OUTPUT"
        fi

        # 4. Enforce fail-on-revertable gate
        if [ "$MODE" = "patch-check" ] && [ "$FAIL_ON_REVERTABLE" = "true" ] && [ "$REVERTABLE_COUNT" -gt 0 ]; then
          echo "::error::Failing CI pipeline: $REVERTABLE_COUNT temporary dependency fork(s) are closed upstream and ready to be reverted!"
          exit 2
        fi
