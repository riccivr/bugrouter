name: Release Pipeline

on:
  push:
    tags:
      - '20[0-9][0-9].[0-1][0-9].*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile & Publish CalVer Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Cross-compile static release binaries
        run: |
          mkdir -p dist
          targets=(
            "linux amd64 bugrouter-linux-amd64"
            "linux arm64 bugrouter-linux-arm64"
            "darwin amd64 bugrouter-darwin-amd64"
            "darwin arm64 bugrouter-darwin-arm64"
            "windows amd64 bugrouter-windows-amd64.exe"
          )
          for target in "${targets[@]}"; do
            read -r os arch out <<< "$target"
            echo "Compiling for $os/$arch -> dist/$out..."
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "dist/$out" \
              ./cmd/bugrouter
          done

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum bugrouter-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bugrouter-linux-amd64
            dist/bugrouter-linux-arm64
            dist/bugrouter-darwin-amd64
            dist/bugrouter-darwin-arm64
            dist/bugrouter-windows-amd64.exe
            dist/SHA256SUMS
          generate_release_notes: true
