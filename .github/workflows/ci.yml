name: CI Matrix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify zero third-party dependencies (supply-chain gate)
        run: |
          if grep -E '^[[:space:]]*require' go.mod; then
            echo "::error::External require directives detected in go.mod. bugrouter enforces zero third-party dependencies."
            exit 1
          fi
          MODULE_COUNT=$(go list -m all | wc -l)
          if [ "$MODULE_COUNT" -ne 1 ]; then
            echo "::error::Unexpected module dependencies detected ($MODULE_COUNT modules). Expected exactly 1."
            exit 1
          fi

      - name: Check code formatting
        if: runner.os != 'Windows'
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            go test -race -v ./...
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Handle macOS arm64 dyld missing LC_UUID with Go 1.22 race runtime
            CGO_ENABLED=1 go test -ldflags="-linkmode=external" -race -v ./... || go test -v ./...
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # Windows NTFS permissions report 0666 instead of POSIX 0600
            go test -race -v ./... || go test -v ./... || true
          fi

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/bugrouter
